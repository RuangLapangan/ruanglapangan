<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RuangLapangan - Kabar & Analisis Sepak Bola</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased">

  <!-- Header -->
  <header class="bg-emerald-800 text-white sticky top-0 z-50 shadow-md">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center space-x-2">
        <i class="fa-solid fa-futbol text-2xl text-emerald-300"></i>
        <h1 class="text-xl font-bold tracking-tight">RUANGLAPANGAN</h1>
      </div>
      <button onclick="fetchNews()" class="bg-emerald-700 hover:bg-emerald-600 text-xs md:text-sm px-3 py-1.5 rounded-lg flex items-center gap-1.5 transition">
        <i class="fa-solid fa-rotate-right"></i> Perbarui Berita
      </button>
    </div>
  </header>

  <!-- Breaking News Bar -->
  <div class="bg-emerald-900 text-emerald-200 text-xs py-2 px-4 shadow-inner">
    <div class="max-w-6xl mx-auto flex items-center gap-2 overflow-hidden">
      <span class="bg-emerald-500 text-black font-bold uppercase px-2 py-0.5 rounded text-[10px]">TERKINI</span>
      <p id="ticker" class="truncate">Menghubungkan ke umpan berita...</p>
    </div>
  </div>

  <!-- Content Container -->
  <main class="max-w-6xl mx-auto px-4 py-6">
    <div class="flex items-center justify-between mb-4">
      <h2 class="text-lg font-bold border-l-4 border-emerald-600 pl-2">Kabar Lapangan</h2>
      <span id="status" class="text-xs text-slate-500"></span>
    </div>

    <!-- News Grid Container -->
    <div id="news-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <div class="bg-white rounded-xl shadow p-4 animate-pulse h-64"></div>
      <div class="bg-white rounded-xl shadow p-4 animate-pulse h-64"></div>
      <div class="bg-white rounded-xl shadow p-4 animate-pulse h-64"></div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-slate-900 text-slate-400 text-center py-6 text-xs mt-12">
    <p>&copy; 2026 RuangLapangan. Semua Hak Cipta Dilindungi.</p>
  </footer>

  <script>
    const FEED_URL = "https://api.rss2json.com/v1/api.json?rss_url=https://www.republika.co.id/rss/sepakbola";

    async function fetchNews() {
      const container = document.getElementById("news-container");
      const ticker = document.getElementById("ticker");
      const status = document.getElementById("status");

      status.innerText = "Memperbarui...";

      try {
        const res = await fetch(FEED_URL);
        const data = await res.json();

        if (data.status === "ok" && data.items.length > 0) {
          ticker.innerText = data.items[0].title;
          status.innerText = `Update: ${new Date().toLocaleTimeString('id-ID')}`;
          
          container.innerHTML = data.items.map(item => {
            const pubDate = new Date(item.pubDate).toLocaleDateString('id-ID', {
              day: 'numeric', month: 'short', year: 'numeric'
            });
            const thumbnail = item.enclosure?.link || item.thumbnail || 'https://images.unsplash.com/photo-1508098682722-e99c43a406b2?w=600&auto=format&fit=crop&q=80';

            return `
              <article class="bg-white rounded-xl shadow-sm hover:shadow-md transition overflow-hidden flex flex-col justify-between border border-slate-200">
                <div>
                  <div class="h-44 w-full overflow-hidden bg-slate-200">
                    <img src="${thumbnail}" alt="${item.title}" class="w-full h-full object-cover" onerror="this.src='https://images.unsplash.com/photo-1508098682722-e99c43a406b2?w=600&auto=format&fit=crop&q=80'" />
                  </div>
                  <div class="p-4">
                    <p class="text-[11px] text-emerald-700 font-semibold mb-1">${pubDate}</p>
                    <h3 class="font-bold text-slate-800 text-sm md:text-base leading-snug line-clamp-2 hover:text-emerald-700">
                      <a href="${item.link}" target="_blank" rel="noopener noreferrer">${item.title}</a>
                    </h3>
                  </div>
                </div>
                <div class="px-4 pb-4 pt-2">
                  <a href="${item.link}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center text-xs font-semibold text-emerald-700 hover:text-emerald-900 gap-1">
                    Baca Selengkapnya <i class="fa-solid fa-arrow-right text-[10px]"></i>
                  </a>
                </div>
              </article>
            `;
          }).join("");
        } else {
          throw new Error("Feed kosong");
        }
      } catch (err) {
        status.innerText = "Gagal memuat feed";
        container.innerHTML = `<p class="col-span-full text-center text-red-500 text-sm py-8">Gagal memuat berita. Silakan coba lagi nanti.</p>`;
      }
    }

    fetchNews();
  </script>
</body>
</html>
