<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RuangLapangan - Kabar & Analisis Sepak Bola</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased flex flex-col min-h-screen">

  <!-- Header -->
  <header class="bg-emerald-800 text-white sticky top-0 z-50 shadow-md">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center space-x-2.5">
        <i class="fa-solid fa-futbol text-2xl text-emerald-300"></i>
        <span class="text-xl font-black tracking-wider uppercase">RUANGLAPANGAN</span>
      </div>
      <button onclick="loadArticles()" class="bg-emerald-700 hover:bg-emerald-600 text-xs md:text-sm px-3.5 py-1.5 rounded-lg flex items-center gap-1.5 transition">
        <i class="fa-solid fa-rotate-right"></i> Segarkan
      </button>
    </div>
  </header>

  <!-- Konten Utama -->
  <main class="max-w-6xl mx-auto px-4 py-8 flex-grow w-full">
    <div class="flex items-center justify-between mb-6">
      <h2 class="text-xl font-extrabold border-l-4 border-emerald-600 pl-3 text-slate-900">Ulasan & Kabar Lapangan</h2>
      <span class="text-xs text-slate-500 font-medium">Dianalisis & Ditulis Mandiri oleh AI</span>
    </div>

    <!-- Grid Artikel -->
    <div id="articles-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <div class="bg-white rounded-xl shadow-sm p-4 animate-pulse h-64 border border-slate-200"></div>
      <div class="bg-white rounded-xl shadow-sm p-4 animate-pulse h-64 border border-slate-200"></div>
      <div class="bg-white rounded-xl shadow-sm p-4 animate-pulse h-64 border border-slate-200"></div>
    </div>
  </main>

  <!-- Modal Baca Artikel Lengkap -->
  <div id="article-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-2xl w-full max-h-[85vh] overflow-y-auto shadow-2xl p-6 relative">
      <button onclick="closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-700 text-xl">
        <i class="fa-solid fa-xmark"></i>
      </button>
      <img id="modal-img" src="" alt="" class="w-full h-56 object-cover rounded-xl mb-4 bg-slate-100" />
      <span id="modal-date" class="text-xs text-emerald-700 font-semibold"></span>
      <h2 id="modal-title" class="text-xl font-bold text-slate-900 mt-1 mb-4 leading-snug"></h2>
      <div id="modal-content" class="text-slate-700 text-sm leading-relaxed space-y-3 whitespace-pre-line border-t pt-4 border-slate-100"></div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="bg-slate-900 text-slate-400 text-center py-6 text-xs mt-12">
    <p>&copy; 2026 RuangLapangan. Menampilkan artikel sepak bola yang ditulis ulang secara independen.</p>
  </footer>

  <script>
    let articlesData = [];

    async function loadArticles() {
      const grid = document.getElementById("articles-grid");
      try {
        const res = await fetch(`articles.json?t=${Date.now()}`);
        if (!res.ok) throw new Error("Gagal memuat file");
        articlesData = await res.json();

        if (!Array.isArray(articlesData) || articlesData.length === 0) {
          throw new Error("Artikel kosong");
        }

        grid.innerHTML = articlesData.map((item, idx) => `
          <article class="bg-white rounded-xl shadow-sm hover:shadow-md transition overflow-hidden flex flex-col justify-between border border-slate-200">
            <div>
              <div class="h-44 w-full overflow-hidden bg-slate-200">
                <img src="${item.img}" alt="${item.title}" class="w-full h-full object-cover" />
              </div>
              <div class="p-4">
                <p class="text-[11px] text-emerald-700 font-semibold mb-1"><i class="fa-regular fa-clock"></i> ${item.date}</p>
                <h3 class="font-bold text-slate-800 text-sm md:text-base leading-snug line-clamp-2">${item.title}</h3>
              </div>
            </div>
            <div class="px-4 pb-4 pt-1">
              <button onclick="readArticle(${idx})" class="w-full bg-emerald-50 hover:bg-emerald-100 text-emerald-800 text-xs font-bold py-2 rounded-lg transition flex items-center justify-center gap-1.5">
                Baca Selengkapnya <i class="fa-solid fa-book-open text-[11px]"></i>
              </button>
            </div>
          </article>
        `).join("");
      } catch (err) {
        grid.innerHTML = `
          <div class="col-span-full text-center py-12 bg-white rounded-xl border border-slate-200">
            <i class="fa-solid fa-robot text-3xl text-emerald-600 mb-3"></i>
            <p class="text-slate-800 font-semibold text-sm">Bot AI Sedang Menyiapkan Artikel Pertama...</p>
            <p class="text-slate-500 text-xs mt-1">Jalankan workflow 'AI Auto News Generator' di tab Actions GitHub untuk menerbitkan.</p>
          </div>
        `;
      }
    }

    function readArticle(idx) {
      const art = articlesData[idx];
      document.getElementById("modal-img").src = art.img;
      document.getElementById("modal-date").innerText = art.date;
      document.getElementById("modal-title").innerText = art.title;
      document.getElementById("modal-content").innerText = art.content;
      document.getElementById("article-modal").classList.remove("hidden");
    }

    function closeModal() {
      document.getElementById("article-modal").classList.add("hidden");
    }

    loadArticles();
  </script>
</body>
</html>
